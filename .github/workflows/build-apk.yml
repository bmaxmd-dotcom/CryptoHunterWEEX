name: Build Crypto Hunter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          mkdir extracted
          unzip -q CryptoHunterWEEX_READY_TO_BUILD.zip -d extracted
          ls -la extracted/CryptoHunterWEEX

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: extracted/CryptoHunterWEEX
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoHunterWEEX-APK
          path: extracted/CryptoHunterWEEX/app/build/outputs/apk/debug/app-debug.apk
